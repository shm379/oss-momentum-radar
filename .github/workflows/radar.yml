name: OSS Momentum Radar
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oss-momentum-radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Update radar with GitHub's built-in token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 radar.py
      - name: Commit report if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history.json reports/latest.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh OSS momentum radar report'
            git push
          fi
